# Builds the signed AAB for a Play upload. Kept separate from android.yml so
# pull request builds never touch signing secrets.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    # Gate the secrets behind an environment, so an unreviewed workflow_dispatch
    # cannot produce a signed artifact on its own.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # No Node step: everything syncGameData copies is tracked, so the
      # released binary is reproducible from the tag alone.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Decoded outside the checkout: anything inside it is reachable by the
      # syncGameData task and by upload-artifact globs.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"

      - name: Resolve version
        run: |
          echo "AEGIS_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "AEGIS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Secrets go in as env, not as -P properties: Gradle properties show up in
      # the process list and in build scans.
      - name: Bundle signed AAB
        working-directory: android
        env:
          AEGIS_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          AEGIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AEGIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AEGIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:bundleRelease

      - name: Shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # mapping.txt is the only way to read an Android Vitals crash stack for
      # this build. Keep it with the AAB, permanently.
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-release-${{ github.ref_name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
