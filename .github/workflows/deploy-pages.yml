name: Deploy to GitHub Pages

# Publishes the small static site the Play listing links to -- the privacy
# policy is a store requirement, so this has to keep working even though the
# web app it used to be built alongside is gone. There is nothing to build:
# the pages are hand-written HTML and are uploaded as they are.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "public/*.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the pages, not public/icons: that is 163 MB of artwork for the
      # APK, and none of it belongs on a privacy policy site.
      - name: Stage the site
        run: |
          mkdir -p site
          cp public/*.html site/
          cp public/game_icon-192.png public/game_icon.svg site/ || true
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
