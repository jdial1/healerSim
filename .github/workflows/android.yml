name: Android

on:
  push:
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The suite is the gate. It used to be backed by a corpus recorded from
      # the JavaScript engine; that engine is gone, so these tests are the whole
      # guard and are written to be.
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # The minified build is what ships, and nothing used to exercise it. This
      # runs R8 and asserts no enum constant was renamed — the failure that
      # silently wipes every player's save. Needs no signing secrets.
      - name: Verify minified release contract
        working-directory: android
        run: ./gradlew --no-daemon :app:minifyReleaseWithR8

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
