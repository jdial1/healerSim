name: Android

on:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Node step: the icons and content JSON that syncGameData copies are
      # all tracked, so the Android build no longer depends on a web install
      # or on two CDNs being reachable.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The parity suite is the gate: it proves the Kotlin engine still matches
      # the JavaScript one that generated parity/golden.json.
      - name: Unit tests (includes engine parity)
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # The minified build is what ships, and nothing used to exercise it. This
      # runs R8 and asserts no enum constant was renamed — the failure that
      # silently wipes every player's save. Needs no signing secrets.
      - name: Verify minified release contract
        working-directory: android
        run: ./gradlew --no-daemon :app:minifyReleaseWithR8

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
